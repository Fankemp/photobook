# Локальная разработка. Запуск: make up (или docker compose up --build -d).
# Значения переменных берутся из .env (шаблон — .env.example).
name: photobook

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Postgres 18 хранит данные в /var/lib/postgresql/18/docker, монтируем родителя.
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1: при первой инициализации Postgres временно слушает только
      # unix-сокет, и проверка через TCP не даст объявить его готовым раньше времени.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # S3-совместимое хранилище для фото и PDF. Бэкенд знает только протокол S3,
  # поэтому сервис можно заменить на другой S3 без изменений кода.
  s3:
    image: rustfs/rustfs:1.0.2
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_OBS_LOG_DIRECTORY: "" # логи в stdout, чтобы видеть их в docker compose logs
    volumes:
      - s3data:/data
    ports:
      # BIND_ADDR=0.0.0.0 открывает порт в локальную сеть (проверка с телефона, см. README).
      - "${BIND_ADDR:-127.0.0.1}:${S3_PORT:-9000}:9000" # S3 API
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001" # веб-консоль
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9000/health"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  backend:
    build:
      context: . # корень репозитория: в образ кладутся backend/ и templates/
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      APP_ENV: ${APP_ENV:-development} # production — строгие проверки паролей при запуске
      S3_ENDPOINT: s3:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
      S3_USE_SSL: "false"
      # Адрес хранилища для браузера: на него указывают ссылки загрузки и просмотра фото.
      # SHARE_* задаёт make share (временный доступ из интернета), иначе — локальные адреса.
      S3_PUBLIC_ENDPOINT: ${SHARE_S3_HOST:-${PUBLIC_HOST:-localhost}:${S3_PORT:-9000}}
      S3_PUBLIC_USE_SSL: ${SHARE_S3_SSL:-false}
      # Адреса сайта, которым хранилище разрешит загружать файлы из браузера (CORS).
      APP_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-5173}${SHARE_SITE_URL:+,${SHARE_SITE_URL}}
      # Адрес сайта для ссылок в уведомлениях.
      APP_BASE_URL: ${SHARE_SITE_URL:-http://${PUBLIC_HOST:-localhost}:${FRONTEND_PORT:-5173}}
      ORDER_MIN_LEAD_DAYS: ${ORDER_MIN_LEAD_DAYS:-3}
      # Telegram-бот для заявок; без токена сообщения пишутся в лог backend.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Админка /admin: логин admin и этот пароль. Без пароля админка выключена.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Печатные PDF: сервис рендера и адрес сайта, который он открывает (внутри Docker).
      RENDER_URL: http://render:3000
      PRINT_BASE_URL: http://frontend:5173
      # true — перевести PDF в CMYK через Ghostscript (пока типографии нужен RGB).
      PDF_CMYK: ${PDF_CMYK:-false}
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # Сборка печатных PDF: Chromium (Playwright) + Ghostscript + poppler-utils.
  # Порт наружу не открыт — к сервису обращается только backend.
  render:
    build: ./render
    init: true # корректно завершает дочерние процессы Chromium
    mem_limit: 1536m # правило 6: ограничение памяти у Chromium
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app # правки в коде сразу видны в браузере (hot reload)
      - frontend_node_modules:/app/node_modules
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
  s3data:
  frontend_node_modules:
