<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{block "title" .}}Админка{{end}} · Фотокниги</title>
  <style>
    /* Админка — рабочий инструмент: читаемо на телефоне и компьютере, без украшений. */
    :root { --bg: #f4f4f5; --card: #fff; --text: #18181b; --muted: #71717a; --line: #e4e4e7; --link: #1d4ed8; --ok: #15803d; --err: #b91c1c; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 860px; margin: 0 auto; padding: 16px; }
    a { color: var(--link); }
    h1 { font-size: 1.375rem; margin: 0 0 12px; }
    h2 { font-size: 1.0625rem; margin: 0 0 8px; }
    .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 12px; }
    .top a { text-decoration: none; }
    .muted { color: var(--muted); }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
    .status { display: inline-block; padding: 1px 10px; border-radius: 999px; font-size: 0.875rem; font-weight: 600; background: #e4e4e7; white-space: nowrap; }
    .s-new { background: #dbeafe; color: #1e40af; }
    .s-awaiting_prepayment { background: #fef3c7; color: #92400e; }
    .s-paid, .s-printing { background: #ede9fe; color: #5b21b6; }
    .s-delivery { background: #cffafe; color: #155e75; }
    .s-done { background: #dcfce7; color: #166534; }
    .s-cancelled { background: #f4f4f5; color: #52525b; text-decoration: line-through; }
    .flash { padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; }
    .flash.ok { background: #dcfce7; color: var(--ok); }
    .flash.err { background: #fee2e2; color: var(--err); }
    button, select, input { font: inherit; }
    button { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); cursor: pointer; }
    button.primary { background: #18181b; color: #fff; border-color: #18181b; }
    select, input[type=text] { min-height: 44px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; width: 100%; }
  </style>
  {{block "styles" .}}{{end}}
</head>
<body>
<main>
  <div class="top">
    <a href="/admin/"><strong>Заявки</strong></a>
    <span class="muted">админка</span>
  </div>
  {{block "content" .}}{{end}}
</main>
</body>
</html>
